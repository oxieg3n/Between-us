<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Between Us | Interactive Demo</title><meta name="description" content="Between Us app concept — when it’s hard to find the words, start here."><meta name="theme-color" content="#F7FAFC">
<style>
:root{--ivory:#F7FAFC;--ocean:#2F6077;--mist:#A9D6DD;--peach:#F0B8A4;--slate:#253746;--ink:#1D303B;--mute:#647680;--border:#D9E6E9;--white:#fff;--wash:#E7F4F6;--coral:#FFE9DE}

.layout{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:36px;padding:30px}.sidebar{width:300px;align-self:center}.sidebar h1{font-family:Comfortaa,"Trebuchet MS",sans-serif;font-size:28px;line-height:1.3;letter-spacing:-.07em;margin:8px 0}.sidebar p{line-height:1.48;color:#5d707b}.screenlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.screenlink{border:1px solid #cbdde3;background:white;border-radius:12px;padding:10px 6px;font-size:11px;font-weight:800;color:#28475a;text-align:left}.screenlink.active{background:#2F6077;color:white;border-color:#2F6077}.smallnote{font-size:11px;margin-top:14px}
.phone{width:390px;height:844px;flex:none;background:var(--ivory);border:7px solid var(--ink);border-radius:43px;box-shadow:0 18px 56px #1c4c5c35;overflow:hidden;position:relative}.status{height:28px;display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;font-weight:900;color:var(--slate);font-size:12px}.status-right{font-size:11px;letter-spacing:2px}.app{height:calc(100% - 28px);display:flex;flex-direction:column}.content{flex:1;min-height:0;overflow-y:auto;padding:13px 22px 16px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.navbar{height:70px;flex:none;border-top:1px solid var(--border);background:#fff;display:flex;justify-content:space-around;align-items:center;padding:4px 8px 10px}.navbtn{border:0;background:transparent;color:#748993;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-width:65px;padding:3px 5px;border-radius:9px;font-size:10px;font-weight:800}.navbtn.on{background:#E1F4F6;color:var(--ocean)}.navsymbol{font-size:22px;line-height:24px;font-weight:400}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.back{background:transparent;border:0;font-size:25px;color:var(--slate);padding:0 7px 0 0}.brand{font-family:Comfortaa,"Trebuchet MS",sans-serif;font-size:19px;font-weight:900;letter-spacing:-1.5px}.brand .us{color:#30849C}.avatar{height:35px;width:35px;border-radius:50%;background:#d8eef1;border:2px solid #2F6077;display:grid;place-items:center;font-size:17px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#557f92;font-weight:900;margin:0 0 9px}.h1{font-size:27px;font-weight:900;line-height:1.2;letter-spacing:-.9px;margin:2px 0 8px}.h2{font-size:21px;font-weight:900;margin:0 0 8px;line-height:1.25}.sub{color:#617682;font-size:13px;line-height:1.45;margin:0 0 18px}.tiny{font-size:11px;color:#6C8390;line-height:1.4}.mini{font-size:12px;color:#637781}.card{background:white;border:1.5px solid var(--border);border-radius:19px;padding:17px;margin:0 0 12px}.card.aqua{background:#E7F5F7;border-color:#c7e6eb}.card.peach{background:#FFF0E8;border-color:#f7d3c4}.card.dark{background:var(--ocean);border-color:var(--ocean);color:white}.card h3{font-size:16px;margin:0 0 5px;font-weight:900}.card p{margin:0;color:#5a727e;font-size:12.5px;line-height:1.45}.card.dark p{color:#D6F3F7}.card.clickable{cursor:pointer}.cardrow{display:flex;gap:13px;align-items:center}.iconbox{flex:none;width:47px;height:47px;background:#D7EFF2;border:1.5px solid #bddce4;border-radius:14px;display:grid;place-items:center;font-size:23px}.iconbox.peach{background:#FBE0D6;border-color:#f2c9ba}.primary{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:14px 17px;background:var(--ocean);border:0;border-radius:14px;color:white;font-weight:900;font-size:14px;min-height:48px}.secondary{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:12px 14px;background:#fff;border:1.5px solid var(--ocean);border-radius:14px;color:var(--ocean);font-weight:900;font-size:13px;min-height:44px}.peachbtn{background:var(--peach);color:#253746}.textbutton{padding:12px 8px;background:none;border:0;font-weight:850;color:var(--ocean)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mood{padding:13px 7px;text-align:center;background:white;border:1.5px solid #d6e6e9;border-radius:15px;font-size:12px;font-weight:850}.mood .emoji{font-size:26px;display:block;margin-bottom:4px}.mood.sel{border:2px solid var(--ocean);background:#e7f5f7}.compactmoods .mood{padding:7px 5px}.compactmoods .mood .emoji{font-size:22px;margin-bottom:2px}.pillrow{display:flex;flex-wrap:wrap;gap:7px}.pill{font-size:11px;font-weight:850;padding:9px 10px;background:#fff;border:1px solid #ccdfe5;border-radius:999px;color:#476477;cursor:pointer}.pill.sel{background:#E1F3F5;border:1.5px solid var(--ocean);color:#264f60}.fieldlabel{font-weight:900;font-size:12px;margin:15px 0 8px;display:block}.textarea{width:100%;resize:none;background:white;border:1.5px solid #cedfe5;border-radius:15px;padding:14px;min-height:136px;line-height:1.55;font-size:13px;color:#2d4754}.input{width:100%;border:1.5px solid #d3e2e8;padding:12px 13px;border-radius:12px;background:white;font-size:13px;color:var(--ink)}.smallbar{height:5px;border-radius:10px;background:#e4ecf0;margin:12px 0 20px;overflow:hidden}.smallbar>span{display:block;height:100%;background:#78c3ce;border-radius:10px}.recipient{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:#eff9fa;border-radius:12px;font-weight:850;font-size:13px;margin:12px 0}.line{height:1px;background:#dbe8eb;margin:15px 0}.disclaimer{background:#eff7fa;border:1px solid #d3e9ee;border-radius:13px;padding:11px 13px;color:#56707c;font-size:11px;line-height:1.4;margin:12px 0}.notification{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #dce9ed;border-radius:15px;padding:12px;margin-bottom:12px;font-size:12px}.bell{background:#fbe4d9;padding:9px;border-radius:12px;font-size:20px}.headerimg{width:195px;height:195px;object-fit:contain;margin:20px auto 0;display:block}.wordmark{font-family:Comfortaa,"Trebuchet MS",sans-serif;font-size:29px;font-weight:900;letter-spacing:-2px;text-align:center;margin:0 0 10px;color:#172f3b}.tagline{text-align:center;color:#325363;font-weight:850;font-size:12px;margin:0 0 14px}.welcome-bg{background:linear-gradient(180deg,#f7fafc 0%,#f7fafc 63%,#e7f7f9 100%);display:flex;flex-direction:column;align-items:stretch;height:100%}.welcome-block{margin:auto 0 0}.welcome-actions{margin:auto 0 25px}.heartbanner{background:linear-gradient(125deg,#DDF3F5,#FFF0E8);border:1px solid #cfe4e7;border-radius:22px;padding:17px;margin:12px 0}.heartbanner h2{margin:0 0 6px;font-size:22px}.heartbanner p{margin:0;color:#5d7884;font-size:12px}.bubble{max-width:88%;padding:12px 14px;border-radius:16px;margin:10px 0;font-size:12px;line-height:1.5}.bubble.out{margin-left:auto;background:#2F6077;color:white;border-bottom-right-radius:5px}.bubble.in{margin-right:auto;background:#DFF2F5;color:#253746;border-bottom-left-radius:5px}.messageheader{display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:13px}.scheduleitem{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;font-size:12px}.scheduleitem span{font-weight:850}.scheduleitem select{max-width:145px;border:1px solid #d1e4e9;border-radius:10px;background:white;padding:9px;font-size:12px;color:#274858}.days{display:flex;justify-content:space-between;gap:5px;margin:7px 0 17px}.day{width:42px;height:39px;border:1.5px solid #cddfe3;border-radius:10px;background:#fff;font-size:11px;font-weight:900;color:#5f7682}.day.selected{background:var(--ocean);color:white;border-color:var(--ocean)}.toggle{display:flex;align-items:center;gap:9px;margin:13px 0;font-size:12px;color:#536d79}.toggle input{accent-color:#2F6077;width:18px;height:18px}.labelstrip{font-size:10px;color:#658292;text-align:center;padding-top:8px}.success{border-radius:20px;background:#dceff2;padding:18px;text-align:center;margin-top:9px}.success .big{font-size:52px;margin-bottom:7px}.success h2{margin:0 0 8px}.success p{font-size:12px;line-height:1.45}.smallhead{font-weight:900;font-size:15px;margin:15px 0 10px}.rolecard{border-radius:18px;border:1.5px solid #cfe1e8;background:#fff;display:flex;align-items:center;gap:12px;padding:14px 12px;margin-bottom:12px;text-align:left;width:100%}.rolecard.peach{background:#fff0e8;border-color:#f1d3c5}.rolecard.aqua{background:#eaf7f8;border-color:#c1e3e8}.rolecard strong{font-size:14px;display:block;margin-bottom:3px}.rolecard small{font-size:11px;color:#67818a;line-height:1.35;display:block}.rolecard .symbol{height:44px;width:44px;border-radius:15px;background:#e7f4f7;display:grid;place-items:center;font-size:24px}.rolecard.peach .symbol{background:#f8dacc}.rolecard .arr{margin-left:auto;font-size:19px;color:#537384}.previewquote{background:white;border:1.5px solid #cce0e7;border-radius:15px;padding:14px;font-size:12.5px;line-height:1.65;color:#2b4757}.dividerlabel{display:flex;align-items:center;gap:10px;color:#70919b;font-size:11px}.dividerlabel:before,.dividerlabel:after{content:'';height:1px;background:#cee3e9;flex:1}
@media(max-width:800px){.layout{padding:12px 0 20px;display:flex;flex-direction:column;gap:14px}.sidebar{width:min(390px,94vw);padding:8px 12px;text-align:center}.sidebar h1{font-size:20px}.sidebar p{font-size:12px;margin:4px}.screenlist{display:flex;overflow:auto;gap:6px;margin-top:10px}.screenlink{flex:none;font-size:10px}.phone{transform-origin:top center;max-width:100vw}.smallnote{display:none}}
body.capture{background:white;min-height:844px}.capture .layout{padding:0;gap:0;display:block}.capture .phone{width:390px;height:844px;border:0;box-shadow:none;border-radius:0}.capture .sidebar{display:none}.capture .status{height:28px}.capture .app{height:calc(100% - 28px)}
</style></head><body>
<div class="layout"><aside class="sidebar"><div class="kicker">Interactive visual prototype</div><h1>Between Us<br>Screen concepts</h1><p>Explore both sides of the app. Tap buttons on the phone to move through the example journeys.</p><div id="screenlist" class="screenlist"></div><p class="smallnote">Concept preview only. Nothing is stored, sent, or scheduled.</p></aside><div class="phone"><div class="status"><span>9:41</span><span class="status-right">▂▅▇ ◕ ▰</span></div><div id="app" class="app"></div></div></div>
<script>
const LOGO='assets/symbol.png';
const SCREENS=[['welcome','01 Welcome'],['pair_parent','02 Parent setup'],['pair_child','03 Child joins'],['kid_home','04 Child home'],['kid_compose','05 Child writes'],['kid_review','06 Child review'],['parent_home','07 Parent home'],['parent_compose','08 Difficult talk'],['parent_review','09 Parent review'],['schedule','10 Schedule'],['checkin_kid','11 Child check-in'],['conversation','12 Conversation'],['privacy','13 Privacy']];
const S={childMessage:'I had a really hard day at school. Some kids were making fun of me, and I didn’t know how to tell you.',parentMessage:'Hey, I need to tell you something important. We’re going to be moving to a new home. I know that could be upsetting, especially because of your friends. You can tell me how you really feel.',need:'Just listen',days:['Mon','Tue','Wed','Thu','Fri'],saved:false,skip:false};
const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const B=(label,target,kind='primary')=>`<button class="${kind}" onclick="go('${target}')">${label}</button>`;
const screenTop=(title,back,avatar='')=>`<div class="top"><div style="display:flex;align-items:center;gap:9px"><button class="back" aria-label="Go back" onclick="go('${back}')">‹</button><span style="font-size:16px;font-weight:900">${title}</span></div>${avatar?`<span class="avatar">${avatar}</span>`:'<span></span>'}</div>`;
const nav=(role,active='home')=>{let items=role==='kid'?[['home','⌂','Home','kid_home'],['chat','♡','Chats','conversation'],['start','✎','Start','kid_compose'],['private','▣','Private','privacy']]:[['home','⌂','Home','parent_home'],['chat','♡','Chats','conversation'],['start','✎','Start','parent_compose'],['check','▦','Check-ins','schedule']];return `<div class="navbar">${items.map(([id,ic,lab,to])=>`<button class="navbtn ${id===active?'on':''}" onclick="go('${to}')"><span class="navsymbol">${ic}</span>${lab}</button>`).join('')}</div>`;};
const wrap=(body,bottom='')=>`<div class="content">${body}<div class="labelstrip">Between Us • Concept only</div></div>${bottom}`;
function showScreen(id){let p='';let bottom='';switch(id){
case 'welcome': p=`<div class="welcome-bg"><div class="welcome-block"><img class="headerimg" src="${LOGO}" alt="Between Us icon"><h1 class="wordmark">Between <span style="color:var(--ocean)">Us</span></h1><p class="tagline">when it's hard to find the words, start here</p><p style="text-align:center;color:#617985;font-size:14px;line-height:1.5;padding:0 17px">A gentle place for families to talk, listen, and stay close.</p></div><div class="welcome-actions">${B('I’m a parent or caregiver →','pair_parent')}<div style="height:10px"></div>${B('I’m a kid or teen →','pair_child','secondary')}<p class="tiny" style="text-align:center;margin-top:14px">Your conversations belong to you.</p></div></div>`;break;
case 'pair_parent':p=`${screenTop('Set up your family','welcome')}<div class="kicker">Step 1 of 2</div><div class="h1">Make a space to connect.</div><p class="sub">Invite your child so both of you can start a conversation whenever you're ready.</p><div class="card aqua"><h3>👨‍👧 Your family space</h3><p>Only invited family members can join your conversations.</p></div><label class="fieldlabel">Family name</label><input class="input" value="Our Family" aria-label="Family name"><label class="fieldlabel">Invite your child</label><div class="card peach" style="text-align:center"><div class="tiny">Example invite code</div><div style="font-size:27px;letter-spacing:4px;font-weight:900;margin:8px 0">BU-0426</div><p>In the actual app, invitations will expire and require acceptance.</p></div>${B('Continue to parent home →','parent_home')}<div class="disclaimer">You'll see only what your child chooses to send. Private drafts aren't visible to parents.</div>`;break;
case 'pair_child':p=`${screenTop('Join your family','welcome')}<div class="kicker">Your space, your voice</div><div class="h1">This is your space, too.</div><p class="sub">You can start talking when you want, ask for help with words, or keep thoughts private.</p><div class="card aqua"><div class="cardrow"><div class="iconbox">👪</div><div><h3>Join “Our Family”</h3><p>Invited by your parent or caregiver</p></div></div></div><div class="smallhead">What your family can see</div><div class="card"><div style="font-size:13px;line-height:2">✓ Messages you choose to send<br>✓ Check-in answers you choose to share<br>✕ Your private drafts or notes</div></div>${B('Accept and open my space →','kid_home')}<div style="height:9px"></div>${B('Not now','welcome','secondary')}<div class="disclaimer">You can skip check-ins. You can ask another trusted adult for help if something feels unsafe.</div>`;break;
case 'kid_home':p=`<div class="top"><span class="brand">Between <span class="us">Us</span></span><button class="avatar" onclick="go('privacy')" aria-label="Privacy">☺</button></div><div class="kicker">Your home</div><div class="h1">Hey, Alex 👋</div><p class="sub">You don't need the perfect words to get started.</p><div class="heartbanner"><div class="h2">Want to talk about something?</div><p>We'll help you find the words, one step at a time.</p><div style="height:12px"></div>${B('Help me say it →','kid_compose')}</div><div class="smallhead">A gentle check-in</div><div class="card peach clickable" onclick="go('checkin_kid')"><div class="cardrow"><div class="iconbox peach">💬</div><div style="flex:1"><h3>Dad is checking in</h3><p>“How was school today?”</p></div><strong>›</strong></div></div><div class="smallhead">Other ways to connect</div><div class="grid2"><div class="card clickable" onclick="go('conversation')"><h3>💌 Messages</h3><p>Talk with Mom</p></div><div class="card clickable" onclick="go('privacy')"><h3>🔒 My space</h3><p>Private drafts</p></div></div>`;bottom=nav('kid');break;
case 'kid_compose':p=`${screenTop('Help me say it','kid_home')}<div class="smallbar"><span style="width:52%"></span></div><div class="kicker">Only you can see this draft</div><div class="h1">What's on your mind?</div><p class="sub">You can write it however it comes out. It doesn't have to sound perfect.</p><div class="recipient">To: Mom <span>✓</span></div><div class="smallhead">How are you feeling?</div><div class="grid2 compactmoods"><button class="mood" onclick="this.classList.toggle('sel')"><span class="emoji">😟</span>Worried</button><button class="mood sel" onclick="this.classList.toggle('sel')"><span class="emoji">😔</span>Sad</button><button class="mood" onclick="this.classList.toggle('sel')"><span class="emoji">😠</span>Upset</button><button class="mood" onclick="this.classList.toggle('sel')"><span class="emoji">💭</span>Not sure</button></div><label class="fieldlabel">Write your thoughts</label><textarea class="textarea" style="min-height:95px" oninput="S.childMessage=this.value">${esc(S.childMessage)}</textarea><div class="disclaimer">✨ Want help organizing your words? Suggestions are optional. Nothing is sent without your review.</div>${B('Choose what I need →','kid_review')}`;bottom=nav('kid','start');break;
case 'kid_review':p=`${screenTop('Review your message','kid_compose')}<div class="smallbar"><span style="width:88%"></span></div><div class="h1">You're in control.</div><p class="sub">Check your words before Mom sees anything.</p><div class="recipient">To: Mom <span>💬</span></div><div class="previewquote">${esc(S.childMessage)}</div><div class="smallhead">What would help right now?</div><div class="pillrow">${['Just listen','Advice','A hug','Talk later'].map(x=>`<button class="pill ${S.need===x?'sel':''}" onclick="S.need='${x}';showScreen('kid_review')">${x}</button>`).join('')}</div><div class="disclaimer">🔒 Only this message and your chosen request will be shared. Your drafts stay private.</div>${B('Send to Mom →','conversation')}<div style="height:9px"></div>${B('Keep editing','kid_compose','secondary')}`;bottom=nav('kid','start');break;
case 'parent_home':p=`<div class="top"><span class="brand">Between <span class="us">Us</span></span><button class="avatar" onclick="go('privacy')">☺</button></div><div class="kicker">Parent home</div><div class="h1">Hi, Dad 👋</div><p class="sub">A small moment of connection can mean a lot.</p><div class="heartbanner"><div class="h2">Need to start a tricky talk?</div><p>Tell us what's happening, then shape the message in your own voice.</p><div style="height:12px"></div>${B('Help me find the words →','parent_compose')}</div><div class="smallhead">Keep the door open</div><div class="card peach clickable" onclick="go('schedule')"><div class="cardrow"><div class="iconbox peach">▦</div><div style="flex:1"><h3>After-school check-in</h3><p>Weekdays • 3:30 PM</p></div><strong>›</strong></div></div><div class="smallhead">Family conversations</div><div class="card clickable" onclick="go('conversation')"><div class="cardrow"><span class="avatar">🧒</span><div style="flex:1"><h3>Alex</h3><p>Tap to continue your conversation</p></div><strong>›</strong></div></div><div class="disclaimer">Try listening first. You don't need to solve everything in the first message.</div>`;bottom=nav('parent');break;
case 'parent_compose':p=`${screenTop('Start a conversation','parent_home')}<div class="smallbar"><span style="width:50%"></span></div><div class="h1">Let's find the words.</div><p class="sub">Sometimes parents need a little help starting, too.</p><div class="recipient">Talking with: Alex <span>✓</span></div><div class="smallhead">What's the conversation about?</div><div class="pillrow"><span class="pill sel">🏠 Family changes</span><span class="pill">An apology</span><span class="pill">A hard day</span><span class="pill">Something else</span></div><label class="fieldlabel">What do you want your child to know?</label><textarea class="textarea" style="min-height:174px" oninput="S.parentMessage=this.value">${esc(S.parentMessage)}</textarea><div class="card aqua"><h3 style="font-size:13px">💡 A gentle starting point</h3><p>Be clear about what's happening. Make room for feelings you might not expect.</p></div>${B('Review before sending →','parent_review')}`;bottom=nav('parent','start');break;
case 'parent_review':p=`${screenTop('Ready to send?','parent_compose')}<div class="smallbar"><span style="width:90%"></span></div><div class="h1">Make it sound like you.</div><p class="sub">You know your child best. Adjust any wording you don't like.</p><div class="recipient">To: Alex <span>♡</span></div><div class="previewquote">${esc(S.parentMessage)}</div><div class="smallhead">What would you like Alex to know?</div><div class="card peach"><h3 style="font-size:13px">No pressure to respond right away</h3><p>They can reply by text or ask for time to think.</p></div>${B('Send to Alex →','conversation')}<div style="height:9px"></div>${B('Edit my words','parent_compose','secondary')}<div class="disclaimer">No message is actually sent in this prototype.</div>`;bottom=nav('parent','start');break;
case 'schedule':p=`${screenTop('Open Door check-ins','parent_home')}<div class="h1">Keep the door open.</div><p class="sub">A simple question at the right time can make talking easier.</p><div class="card aqua"><h3>📅 New recurring check-in</h3><p>Alex can always skip or reply later.</p></div><label class="fieldlabel">Ask Alex</label><input class="input" value="How was school today?" aria-label="Scheduled question"><label class="fieldlabel">Days to check in</label><div class="days">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<button class="day ${S.days.includes(d)?'selected':''}" onclick="toggleDay('${d}')">${d.slice(0,1)}</button>`).join('')}</div><div class="scheduleitem"><span>Time</span><select aria-label="Time"><option>3:30 PM • After school</option><option>6:00 PM • Evening</option><option>8:00 PM • Bedtime</option></select></div><div class="scheduleitem"><span>Repeat</span><select aria-label="Repeat"><option>Weekly</option><option>Once</option></select></div><label class="toggle"><input type="checkbox" checked>Let Alex skip without a reminder</label><div class="line"></div>${B('Preview as Alex →','checkin_kid','secondary')}<div style="height:10px"></div><button class="primary" onclick="S.saved=true;go('parent_home')">Save this check-in</button><p class="tiny" style="text-align:center">Prototype only. No notifications will be scheduled.</p>`;bottom=nav('parent','check');break;

function go(id){history.replaceState({},'',location.pathname+'?screen='+id+(location.search.includes('capture=1')?'&capture=1':''));showScreen(id);}
function toggleDay(d){S.days=S.days.includes(d)?S.days.filter(x=>x!==d):[...S.days,d];showScreen('schedule');}
const list=document.getElementById('screenlist');list.innerHTML=SCREENS.map(([id,label])=>`<button class="screenlink" data-target="${id}" onclick="go('${id}')">${label}</button>`).join('');
if(new URLSearchParams(location.search).get('capture')==='1')document.body.classList.add('capture');
showScreen(new URLSearchParams(location.search).get('screen')||'welcome');
